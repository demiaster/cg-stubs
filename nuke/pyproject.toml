[project]
name = "types-nuke"
version = "16.0.3.0"

readme = "README.md"
authors = [
    {name = "Chad Dombrova"},
    {name = "Nathan Rusch"},
]
description = "Unofficial python stubs for Foundry Nuke"
license = "MIT"

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 2",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Typing :: Stubs Only",
]
repository = "https://github.com/LumaPictures/cg-stubs"
homepage = "https://github.com/LumaPictures/cg-stubs"

keywords = ["3d", "graphics", "games", "VFX", "CG", "animation"]

[dependency-groups]
dev = [
    "stubgenlib",
]

[tool.uv]
# Disable the any compiled `mypy` submodules so we can monkey-patch
# various parts of its stub generation machinery.
no-binary-package = ["mypy"]

[tool.uv.sources]
stubgenlib = { path = "../common" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stubs/nuke-stubs"]

[tool.hatch.build]
# uv+hatch does not write anything to the installed .pth file if the contents
# of the package do no include .py files.  Adding this ensures the .pth file
# is written correctly
dev-mode-dirs = ["stubs"]

[tool.mypy]
follow_imports = "skip"
check_untyped_defs = true
files = [
    "get_py_version.py",
    "nuke_shim.py",
    "stubgen_nuke.py",
    "nuke_shim.py",
]
